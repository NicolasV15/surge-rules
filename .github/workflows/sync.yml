name: Sync upstream rule sets
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
concurrency:
  group: upstream-rules
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch and validate upstream rules
        run: |
          set -euo pipefail
          python3 scripts/rules.py sync --report "$RUNNER_TEMP/upstream.md"
          cat "$RUNNER_TEMP/upstream.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the upstream pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=automation/upstream-rules
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if git diff --quiet -- rules/track snapshots.json; then
            if [[ -n "$pr" ]]; then
              gh pr close "$pr" --comment '当前上游规则与 main 相同，关闭已过时的同步提案。'
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/track snapshots.json
          git commit -m 'Sync tracked Surge rules'
          head=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$head" origin "HEAD:refs/heads/$branch"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/upstream.md"
          else
            gh pr create --base main --head "$branch" --title '同步上游 Surge 规则' --body-file "$RUNNER_TEMP/upstream.md"
          fi
